<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>제주 성전 귤 — 모바일 주문</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Noto+Serif+KR:wght@400;500;600;700;900&family=Nanum+Pen+Script&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />

<style>
  :root {
    /* Shared tokens */
    --orange: #F5923E;
    --orange-deep: #E07B2C;
    --leaf: #6B8E4E;
    --leaf-deep: #4F6E38;
    --cream: #FAF6EF;
    --cream-2: #F3ECDC;
    --ink: #1C1A15;
    --ink-2: #3A362C;
    --muted: #8B8578;
    --line: #E8E0D0;
    --white: #FFFFFF;
    --shadow-sm: 0 1px 2px rgba(28,26,21,.04), 0 2px 8px rgba(28,26,21,.04);
    --shadow-md: 0 2px 6px rgba(28,26,21,.05), 0 10px 24px rgba(28,26,21,.06);
    --shadow-lg: 0 8px 24px rgba(28,26,21,.08), 0 20px 60px rgba(28,26,21,.08);

    /* 노안 모드 스케일 */
    --fs-scale: 1;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', 'Pretendard', -apple-system, system-ui, sans-serif;
    background: #E6DFCE;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ===== Stage (single phone preview) ===== */
  .stage {
    display: flex;
    justify-content: center;
    padding: 40px 16px 60px;
  }
  @media (max-width: 480px) {
    .stage { padding: 0; }
  }

  /* ===== Phone frame ===== */
  .phone {
    width: 390px;
    height: 800px;
    background: #111;
    border-radius: 48px;
    padding: 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,.22), 0 8px 24px rgba(0,0,0,.12);
    position: relative;
    flex-shrink: 0;
  }
  .phone-screen {
    width: 100%; height: 100%;
    border-radius: 38px;
    overflow: hidden;
    position: relative;
    background: var(--cream);
    display: flex;
    flex-direction: column;
  }
  .phone-notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #111; border-radius: 0 0 18px 18px;
    z-index: 50;
  }
  .status-bar {
    height: 44px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px 0 24px;
    font-size: 13px; font-weight: 600;
    color: var(--ink);
    position: relative;
    z-index: 10;
  }
  .status-bar .right { display: flex; align-items: center; gap: 5px; }
  .status-bar .battery {
    width: 24px; height: 11px; border: 1.2px solid currentColor; border-radius: 3px;
    position: relative;
  }
  .status-bar .battery::after {
    content: ''; position: absolute; right: -3px; top: 3px; width: 2px; height: 5px;
    background: currentColor; border-radius: 0 1px 1px 0;
  }
  .status-bar .battery::before {
    content: ''; position: absolute; inset: 1px; width: calc(100% - 6px); background: currentColor; border-radius: 1px;
  }

  /* Screen body gets its own scroll + bottom CTA overlay */
  .screen-body {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    scroll-behavior: smooth;
    position: relative;
  }
  .screen-body::-webkit-scrollbar { width: 0; }

  /* ========== Shared form-ish components ========== */
  .field-label {
    display: block; font-size: calc(14px * var(--fs-scale));
    font-weight: 500; color: var(--ink-2); margin-bottom: 8px;
  }
  .field-label .req { color: var(--orange-deep); margin-left: 2px; }
  .input, .textarea {
    width: 100%; height: 56px; padding: 0 16px;
    font-family: inherit;
    font-size: calc(16px * var(--fs-scale));
    font-weight: 500;
    color: var(--ink);
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .input::placeholder { color: #B8B0A0; font-weight: 400; }
  .input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(245,146,62,.15); }
  .input[readonly] { background: #F7F2E7; color: var(--muted); }

  /* Toast */
  .toast-wrap {
    position: absolute; left: 0; right: 0; bottom: 120px;
    display: flex; justify-content: center; pointer-events: none;
    z-index: 100;
  }
  .toast {
    background: rgba(28,26,21,.92); color: white;
    padding: 12px 20px; border-radius: 999px;
    font-size: 14px; font-weight: 500;
    transform: translateY(20px); opacity: 0;
    transition: transform .28s cubic-bezier(.3,1.3,.3,1), opacity .2s;
    display: flex; align-items: center; gap: 8px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* Bottom fixed CTA */
  .cta-dock {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(env(safe-area-inset-bottom, 20px) + 20px);
    background: linear-gradient(to top, rgba(255,255,255,1) 60%, rgba(255,255,255,0));
    z-index: 30;
  }
  .cta {
    width: 100%; height: 60px; border: 0; border-radius: 16px;
    font-family: inherit; font-size: calc(18px * var(--fs-scale)); font-weight: 700;
    color: white;
    background: linear-gradient(180deg, #F5923E 0%, #E07B2C 100%);
    box-shadow: 0 6px 20px rgba(224,123,44,.35), inset 0 1px 0 rgba(255,255,255,.3);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .08s;
  }
  .cta:active { transform: translateY(1px); }
  .cta:disabled {
    background: #D8D1C2; box-shadow: none; color: #8B8578; cursor: not-allowed;
  }

  /* Keyboard hint */
  .kbd-hint {
    font-size: 11px; color: var(--muted); text-align: center; padding: 14px 20px;
  }

  /* ============================================================ */
  /* VARIANT A — 따뜻한 자연주의 (Warm Standard) */
  /* ============================================================ */
  .v-a { background: var(--cream); font-family: 'Noto Sans KR', sans-serif; }
  .v-a .hero-a {
    padding: 14px 20px 28px;
    background: linear-gradient(180deg, var(--cream) 0%, #FDF9F1 100%);
    border-bottom: 1px solid rgba(107,142,78,.1);
  }
  .v-a .hero-a .leaf-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; background: rgba(107,142,78,.1); color: var(--leaf-deep);
    border-radius: 999px; font-size: 12px; font-weight: 600; margin-bottom: 14px;
  }
  .v-a .hero-a h1 {
    font-size: calc(28px * var(--fs-scale));
    font-weight: 800; letter-spacing: -0.03em;
    margin: 0 0 10px; line-height: 1.2; color: var(--ink);
  }
  .v-a .hero-a h1 .orange { color: var(--orange-deep); }
  .v-a .hero-a .sub {
    font-size: calc(14px * var(--fs-scale));
    color: #6B6355; line-height: 1.6; margin: 0;
  }
  .v-a .hero-a .sub b { color: var(--leaf-deep); font-weight: 600; }

  .v-a .hero-photo {
    margin: 16px 0 0;
    aspect-ratio: 16 / 10;
    border-radius: 18px;
    background:
      radial-gradient(circle at 30% 40%, #F5C67E 0%, transparent 40%),
      radial-gradient(circle at 70% 60%, #E07B2C 0%, transparent 45%),
      linear-gradient(135deg, #A8C080 0%, #6B8E4E 100%);
    position: relative; overflow: hidden;
    display: flex; align-items: end; padding: 16px;
    color: white;
  }
  .v-a .hero-photo::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(245,198,126,.8) 0 14px, transparent 15px),
      radial-gradient(circle at 50% 50%, rgba(245,146,62,.7) 0 18px, transparent 19px),
      radial-gradient(circle at 75% 35%, rgba(224,123,44,.6) 0 12px, transparent 13px),
      radial-gradient(circle at 35% 70%, rgba(245,146,62,.55) 0 16px, transparent 17px),
      radial-gradient(circle at 80% 75%, rgba(245,198,126,.55) 0 11px, transparent 12px);
  }
  .v-a .hero-photo .cap {
    position: relative; z-index: 2;
    font-size: 11px; padding: 6px 10px; background: rgba(0,0,0,.3);
    border-radius: 6px; backdrop-filter: blur(4px); letter-spacing: 0.02em;
  }

  .section-a {
    padding: 28px 20px 10px;
  }
  .section-a > h2 {
    font-size: calc(18px * var(--fs-scale));
    font-weight: 700; margin: 0 0 4px; color: var(--ink);
    letter-spacing: -0.02em;
  }
  .section-a > .section-desc {
    font-size: calc(13px * var(--fs-scale));
    color: #8B8578; margin: 0 0 16px;
  }
  .section-a .num {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--leaf-deep); font-weight: 600;
    margin-bottom: 8px;
  }
  .section-a .num-dot {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--leaf); color: white;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }

  /* product card A */
  .v-a .prod {
    background: white;
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 12px;
    transition: border-color .18s, box-shadow .18s, transform .18s;
    cursor: pointer;
    position: relative;
  }
  .v-a .prod.has {
    border-color: var(--orange);
    box-shadow: 0 0 0 4px rgba(245,146,62,.12), 0 4px 18px rgba(245,146,62,.14);
  }
  .v-a .prod-top {
    display: flex; align-items: start; gap: 14px;
  }
  .v-a .prod-img {
    width: 72px; height: 72px; border-radius: 14px;
    background:
      radial-gradient(circle at 40% 40%, #F5C67E 0 20px, transparent 21px),
      radial-gradient(circle at 70% 65%, #E07B2C 0 16px, transparent 17px),
      radial-gradient(circle at 25% 70%, #F5923E 0 12px, transparent 13px),
      linear-gradient(135deg, #FAF6EF 0%, #F3ECDC 100%);
    flex-shrink: 0; border: 1px solid var(--line);
  }
  .v-a .prod-img.b5 {
    background:
      radial-gradient(circle at 50% 50%, #F5C67E 0 24px, transparent 25px),
      radial-gradient(circle at 30% 30%, #E07B2C 0 10px, transparent 11px),
      radial-gradient(circle at 75% 70%, #F5923E 0 11px, transparent 12px),
      linear-gradient(135deg, #FFF8EB 0%, #F5ECD5 100%);
  }
  .v-a .prod-meta { flex: 1; min-width: 0; }
  .v-a .prod-title {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .v-a .prod-title strong {
    font-size: calc(17px * var(--fs-scale));
    font-weight: 700; color: var(--ink);
  }
  .v-a .prod-title .chip {
    font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
    color: var(--leaf-deep); background: rgba(107,142,78,.12);
    padding: 3px 8px; border-radius: 6px;
  }
  .v-a .prod-desc {
    font-size: calc(13px * var(--fs-scale));
    color: #6B6355; line-height: 1.55; margin: 0 0 8px;
  }
  .v-a .prod-price {
    font-size: calc(18px * var(--fs-scale));
    font-weight: 800; color: var(--orange-deep);
    letter-spacing: -0.02em;
  }
  .v-a .prod-price .won {
    font-size: 0.75em; font-weight: 600; color: var(--orange-deep);
  }

  /* stepper */
  .stepper {
    display: flex; align-items: center; gap: 10px;
    margin-top: 16px; justify-content: space-between;
    padding-top: 14px; border-top: 1px dashed var(--line);
  }
  .stepper .lbl { font-size: calc(13px * var(--fs-scale)); color: #6B6355; font-weight: 500; }
  .stepper .ctrl { display: flex; align-items: center; gap: 14px; }
  .stepper button {
    width: 40px; height: 40px; border-radius: 12px;
    border: 1.5px solid var(--line); background: white;
    display: grid; place-items: center;
    cursor: pointer; transition: all .15s;
    font-size: 20px; color: var(--ink);
    font-family: inherit; font-weight: 600;
  }
  .stepper button:hover:not(:disabled) { border-color: var(--orange); color: var(--orange-deep); }
  .stepper button:active:not(:disabled) { transform: scale(.94); }
  .stepper button:disabled { color: #D0C8B8; cursor: not-allowed; }
  .stepper .count {
    min-width: 28px; text-align: center;
    font-size: calc(18px * var(--fs-scale));
    font-weight: 700; color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  /* sticky total A */
  .v-a .total-sticky {
    position: sticky; top: 0; z-index: 20;
    margin: 0 -20px;
    padding: 14px 20px;
    background: rgba(250,246,239,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(107,142,78,.15);
  }
  .v-a .total-box {
    background: white; border-radius: 16px; padding: 14px 16px;
    border: 1.5px solid var(--orange);
    box-shadow: 0 4px 12px rgba(245,146,62,.1);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .v-a .total-box.empty {
    border-color: var(--line); box-shadow: none;
  }
  .v-a .total-breakdown {
    font-size: calc(12px * var(--fs-scale));
    color: #6B6355; line-height: 1.5; flex: 1; min-width: 0;
  }
  .v-a .total-breakdown.empty { color: #B8B0A0; font-size: calc(13px * var(--fs-scale)); }
  .v-a .total-breakdown b { color: var(--ink); font-weight: 600; }
  .v-a .total-sum {
    font-size: calc(22px * var(--fs-scale));
    font-weight: 900; color: var(--orange-deep);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .v-a .total-sum .won {
    font-size: .7em; font-weight: 700; margin-left: 1px;
  }

  /* receiver toggle */
  .toggle-row {
    background: white; border-radius: 14px; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; border: 1.5px solid var(--line);
    margin-bottom: 14px;
  }
  .toggle-row .label {
    font-size: calc(15px * var(--fs-scale)); font-weight: 600; color: var(--ink);
  }
  .toggle-row .sub {
    font-size: calc(12px * var(--fs-scale));
    color: #8B8578; margin-top: 2px;
  }
  .switch {
    width: 52px; height: 30px; border-radius: 999px;
    background: #D8D1C2; position: relative; cursor: pointer;
    transition: background .2s;
    flex-shrink: 0;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%;
    background: white;
    box-shadow: 0 2px 6px rgba(0,0,0,.18);
    transition: transform .22s cubic-bezier(.3,1.3,.3,1);
  }
  .switch.on { background: var(--leaf); }
  .switch.on::after { transform: translateX(22px); }

  .row-2 { display: grid; grid-template-columns: 120px 1fr; gap: 10px; }

  .addr-btn {
    height: 48px; padding: 0 14px;
    background: var(--ink); color: white; border: 0; border-radius: 12px;
    font-family: inherit; font-size: calc(14px * var(--fs-scale)); font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }

  /* bank card A */
  .bank-card {
    background: linear-gradient(135deg, #FFFEFB 0%, #FDF7EB 100%);
    border: 1.5px solid var(--orange);
    border-radius: 18px; padding: 18px;
    position: relative; overflow: hidden;
  }
  .bank-card::before {
    content: ''; position: absolute; right: -20px; top: -20px;
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, rgba(245,146,62,.25) 0%, transparent 70%);
  }
  .bank-card .lbl { font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.06em; }
  .bank-card .num {
    font-size: calc(20px * var(--fs-scale));
    font-weight: 800; color: var(--ink); letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
  }
  .bank-card .owner { font-size: calc(13px * var(--fs-scale)); color: #6B6355; }
  .copy-btn {
    position: absolute; top: 16px; right: 16px;
    width: 54px; height: 54px; border-radius: 14px;
    background: var(--orange); color: white;
    border: 0; cursor: pointer; display: grid; place-items: center;
    box-shadow: 0 4px 12px rgba(245,146,62,.35);
    transition: transform .08s;
  }
  .copy-btn:active { transform: scale(.94); }

  /* consent */
  .consent {
    display: flex; align-items: start; gap: 10px;
    padding: 14px 16px; background: white; border: 1.5px solid var(--line);
    border-radius: 14px; cursor: pointer;
    margin-top: 14px;
  }
  .consent .check {
    width: 22px; height: 22px; border-radius: 6px;
    border: 2px solid var(--line); background: white;
    flex-shrink: 0; display: grid; place-items: center;
    margin-top: 1px;
    transition: all .15s;
  }
  .consent.on .check { background: var(--orange); border-color: var(--orange); }
  .consent .txt {
    font-size: calc(13px * var(--fs-scale)); color: #4A453A; line-height: 1.55;
  }
  .consent .txt b { color: var(--ink); font-weight: 600; }

  /* Address modal (shared) */
  .modal-scrim {
    position: absolute; inset: 0; z-index: 120;
    background: rgba(28,26,21,.55);
    display: none;
    align-items: end;
    animation: fadeIn .18s ease;
  }
  .modal-scrim.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-sheet {
    width: 100%; height: 82%;
    background: white; border-radius: 20px 20px 0 0;
    padding: 8px 20px 24px;
    display: flex; flex-direction: column;
    animation: slideUp .28s cubic-bezier(.3,1.2,.3,1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-sheet .handle {
    width: 40px; height: 4px; background: #D8D1C2; border-radius: 2px;
    margin: 8px auto 14px;
  }
  .modal-sheet h3 {
    font-size: 17px; font-weight: 700; margin: 0 0 12px;
  }
  .modal-sheet .search-box {
    display: flex; align-items: center; gap: 8px;
    background: #F5F0E6; border-radius: 12px; padding: 0 14px;
    height: 48px;
  }
  .modal-sheet .search-box input {
    flex: 1; border: 0; background: transparent; outline: none;
    font-family: inherit; font-size: 15px;
  }
  .modal-sheet .results {
    flex: 1; overflow-y: auto; margin: 12px -20px 0; padding: 0 20px;
  }
  .modal-sheet .result-item {
    padding: 14px 0; border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .modal-sheet .result-item:hover { background: #FAF6EF; margin: 0 -20px; padding: 14px 20px; }
  .modal-sheet .zip {
    display: inline-block; padding: 2px 8px; background: var(--leaf);
    color: white; font-size: 11px; font-weight: 700; border-radius: 4px;
    margin-right: 8px;
    font-variant-numeric: tabular-nums;
  }
  .modal-sheet .addr-main { font-size: 14px; font-weight: 500; color: var(--ink); margin-top: 6px; }
  .modal-sheet .addr-old { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .modal-sheet .close-x {
    position: absolute; top: 14px; right: 18px; width: 32px; height: 32px;
    border-radius: 50%; background: #F5F0E6; border: 0;
    display: grid; place-items: center; cursor: pointer; font-size: 18px;
    color: var(--ink);
  }
  .modal-sheet .empty-hint {
    text-align: center; padding: 30px 20px; color: var(--muted); font-size: 13px;
    line-height: 1.6;
  }

  /* Success screen */
  .success-screen {
    position: absolute; inset: 0; z-index: 200;
    background: var(--cream);
    display: none;
    flex-direction: column;
    animation: fadeIn .2s ease;
  }
  .success-screen.show { display: flex; }

  /* ============================================================ */
  /* VARIANT B — 미니멀 프리미엄 */
  /* ============================================================ */
  .v-b {
    background: white;
    font-family: 'Noto Sans KR', sans-serif;
    color: #0A0A0A;
  }
  .v-b .screen-body { background: white; }

  .v-b .hero-b {
    padding: 20px 24px 28px;
    border-bottom: 1px solid #EEE;
  }
  .v-b .hero-b .year {
    font-size: 12px; font-weight: 700; letter-spacing: 0.24em;
    color: var(--orange-deep); margin-bottom: 12px;
  }
  .v-b .hero-b h1 {
    font-size: calc(34px * var(--fs-scale));
    font-weight: 900; letter-spacing: -0.04em;
    line-height: 1.05;
    margin: 0 0 16px;
    color: #0A0A0A;
  }
  .v-b .hero-b .rule {
    height: 1px; background: #0A0A0A; width: 40px; margin: 18px 0;
  }
  .v-b .hero-b .meta {
    display: grid; gap: 8px;
    font-size: calc(13px * var(--fs-scale));
    color: #333;
    line-height: 1.5;
  }
  .v-b .hero-b .meta .k {
    color: #999; font-weight: 500; display: inline-block; width: 60px;
  }
  .v-b .hero-b .meta .v {
    color: #0A0A0A; font-weight: 500;
  }
  .v-b .hero-photo-b {
    aspect-ratio: 5 / 4;
    margin: 18px 0 0;
    background:
