<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>제주 성전 귤 주문 — 3개 변형</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Noto+Serif+KR:wght@400;500;600;700;900&family=Nanum+Pen+Script&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />

<style>
  :root {
    /* Shared tokens */
    --orange: #F5923E;
    --orange-deep: #E07B2C;
    --leaf: #6B8E4E;
    --leaf-deep: #4F6E38;
    --cream: #FAF6EF;
    --cream-2: #F3ECDC;
    --ink: #1C1A15;
    --ink-2: #3A362C;
    --muted: #8B8578;
    --line: #E8E0D0;
    --white: #FFFFFF;
    --shadow-sm: 0 1px 2px rgba(28,26,21,.04), 0 2px 8px rgba(28,26,21,.04);
    --shadow-md: 0 2px 6px rgba(28,26,21,.05), 0 10px 24px rgba(28,26,21,.06);
    --shadow-lg: 0 8px 24px rgba(28,26,21,.08), 0 20px 60px rgba(28,26,21,.08);

    /* 노안 모드 스케일 */
    --fs-scale: 1;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', 'Pretendard', -apple-system, system-ui, sans-serif;
    background: #E6DFCE;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ===== Outer page (gallery) ===== */
  .page-head {
    padding: 40px 32px 16px;
    max-width: 1600px; margin: 0 auto;
  }
  .page-head h1 {
    font-size: 28px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.02em;
  }
  .page-head p { margin: 0; color: #6B6355; font-size: 14px; line-height: 1.6; }
  .page-head .dims { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; color: #6B6355; }
  .page-head .dims b { color: var(--ink); font-weight: 600; }

  .gallery {
    display: grid;
    grid-template-columns: repeat(3, minmax(380px, 1fr));
    gap: 28px;
    padding: 24px 32px 80px;
    max-width: 1600px;
    margin: 0 auto;
  }
  @media (max-width: 1280px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 860px) {
    .gallery { grid-template-columns: 1fr; }
  }

  .variant-col {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .variant-label {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #6B6355;
  }
  .variant-label .badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--ink); color: white; font-weight: 700; font-size: 12px;
  }
  .variant-label h2 {
    margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: 0;
    text-transform: none;
  }
  .variant-label small { color: #8B8578; font-size: 12px; }

  /* ===== Phone frame ===== */
  .phone {
    width: 390px;
    height: 800px;
    background: #111;
    border-radius: 48px;
    padding: 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,.22), 0 8px 24px rgba(0,0,0,.12);
    position: relative;
    flex-shrink: 0;
  }
  .phone-screen {
    width: 100%; height: 100%;
    border-radius: 38px;
    overflow: hidden;
    position: relative;
    background: var(--cream);
    display: flex;
    flex-direction: column;
  }
  .phone-notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #111; border-radius: 0 0 18px 18px;
    z-index: 50;
  }
  .status-bar {
    height: 44px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px 0 24px;
    font-size: 13px; font-weight: 600;
    color: var(--ink);
    position: relative;
    z-index: 10;
  }
  .status-bar .right { display: flex; align-items: center; gap: 5px; }
  .status-bar .battery {
    width: 24px; height: 11px; border: 1.2px solid currentColor; border-radius: 3px;
    position: relative;
  }
  .status-bar .battery::after {
    content: ''; position: absolute; right: -3px; top: 3px; width: 2px; height: 5px;
    background: currentColor; border-radius: 0 1px 1px 0;
  }
  .status-bar .battery::before {
    content: ''; position: absolute; inset: 1px; width: calc(100% - 6px); background: currentColor; border-radius: 1px;
  }

  /* Screen body gets its own scroll + bottom CTA overlay */
  .screen-body {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    scroll-behavior: smooth;
    position: relative;
  }
  .screen-body::-webkit-scrollbar { width: 0; }

  /* ========== Shared form-ish components ========== */
  .field-label {
    display: block; font-size: calc(14px * var(--fs-scale));
    font-weight: 500; color: var(--ink-2); margin-bottom: 8px;
  }
  .field-label .req { color: var(--orange-deep); margin-left: 2px; }
  .input, .textarea {
    width: 100%; height: 56px; padding: 0 16px;
    font-family: inherit;
    font-size: calc(16px * var(--fs-scale));
    font-weight: 500;
    color: var(--ink);
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .input::placeholder { color: #B8B0A0; font-weight: 400; }
  .input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(245,146,62,.15); }
  .input[readonly] { background: #F7F2E7; color: var(--muted); }

  /* Toast */
  .toast-wrap {
    position: absolute; left: 0; right: 0; bottom: 120px;
    display: flex; justify-content: center; pointer-events: none;
    z-index: 100;
  }
  .toast {
    background: rgba(28,26,21,.92); color: white;
    padding: 12px 20px; border-radius: 999px;
    font-size: 14px; font-weight: 500;
    transform: translateY(20px); opacity: 0;
    transition: transform .28s cubic-bezier(.3,1.3,.3,1), opacity .2s;
    display: flex; align-items: center; gap: 8px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* Bottom fixed CTA */
  .cta-dock {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(env(safe-area-inset-bottom, 20px) + 20px);
    background: linear-gradient(to top, rgba(255,255,255,1) 60%, rgba(255,255,255,0));
    z-index: 30;
  }
  .cta {
    width: 100%; height: 60px; border: 0; border-radius: 16px;
    font-family: inherit; font-size: calc(18px * var(--fs-scale)); font-weight: 700;
    color: white;
    background: linear-gradient(180deg, #F5923E 0%, #E07B2C 100%);
    box-shadow: 0 6px 20px rgba(224,123,44,.35), inset 0 1px 0 rgba(255,255,255,.3);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .08s;
  }
  .cta:active { transform: translateY(1px); }
  .cta:disabled {
    background: #D8D1C2; box-shadow: none; color: #8B8578; cursor: not-allowed;
  }

  /* Keyboard hint */
  .kbd-hint {
    font-size: 11px; color: var(--muted); text-align: center; padding: 14px 20px;
  }

  /* ============================================================ */
  /* VARIANT A — 따뜻한 자연주의 (Warm Standard) */
  /* ============================================================ */
  .v-a { background: var(--cream); font-family: 'Noto Sans KR', sans-serif; }
  .v-a .hero-a {
    padding: 14px 20px 28px;
    background: linear-gradient(180deg, var(--cream) 0%, #FDF9F1 100%);
    border-bottom: 1px solid rgba(107,142,78,.1);
  }
  .v-a .hero-a .leaf-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; background: rgba(107,142,78,.1); color: var(--leaf-deep);
    border-radius: 999px; font-size: 12px; font-weight: 600; margin-bottom: 14px;
  }
  .v-a .hero-a h1 {
    font-size: calc(28px * var(--fs-scale));
    font-weight: 800; letter-spacing: -0.03em;
    margin: 0 0 10px; line-height: 1.2; color: var(--ink);
  }
  .v-a .hero-a h1 .orange { color: var(--orange-deep); }
  .v-a .hero-a .sub {
    font-size: calc(14px * var(--fs-scale));
    color: #6B6355; line-height: 1.6; margin: 0;
  }
  .v-a .hero-a .sub b { color: var(--leaf-deep); font-weight: 600; }

  .v-a .hero-photo {
    margin: 16px 0 0;
    aspect-ratio: 16 / 10;
    border-radius: 18px;
    background:
      radial-gradient(circle at 30% 40%, #F5C67E 0%, transparent 40%),
      radial-gradient(circle at 70% 60%, #E07B2C 0%, transparent 45%),
      linear-gradient(135deg, #A8C080 0%, #6B8E4E 100%);
    position: relative; overflow: hidden;
    display: flex; align-items: end; padding: 16px;
    color: white;
  }
  .v-a .hero-photo::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(245,198,126,.8) 0 14px, transparent 15px),
      radial-gradient(circle at 50% 50%, rgba(245,146,62,.7) 0 18px, transparent 19px),
      radial-gradient(circle at 75% 35%, rgba(224,123,44,.6) 0 12px, transparent 13px),
      radial-gradient(circle at 35% 70%, rgba(245,146,62,.55) 0 16px, transparent 17px),
      radial-gradient(circle at 80% 75%, rgba(245,198,126,.55) 0 11px, transparent 12px);
  }
  .v-a .hero-photo .cap {
    position: relative; z-index: 2;
    font-size: 11px; padding: 6px 10px; background: rgba(0,0,0,.3);
    border-radius: 6px; backdrop-filter: blur(4px); letter-spacing: 0.02em;
  }

  .section-a {
    padding: 28px 20px 10px;
  }
  .section-a > h2 {
    font-size: calc(18px * var(--fs-scale));
    font-weight: 700; margin: 0 0 4px; color: var(--ink);
    letter-spacing: -0.02em;
  }
  .section-a > .section-desc {
    font-size: calc(13px * var(--fs-scale));
    color: #8B8578; margin: 0 0 16px;
  }
  .section-a .num {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--leaf-deep); font-weight: 600;
    margin-bottom: 8px;
  }
  .section-a .num-dot {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--leaf); color: white;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }

  /* product card A */
  .v-a .prod {
    background: white;
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 12px;
    transition: border-color .18s, box-shadow .18s, transform .18s;
    cursor: pointer;
    position: relative;
  }
  .v-a .prod.has {
    border-color: var(--orange);
    box-shadow: 0 0 0 4px rgba(245,146,62,.12), 0 4px 18px rgba(245,146,62,.14);
  }
  .v-a .prod-top {
    display: flex; align-items: start; gap: 14px;
  }
  .v-a .prod-img {
    width: 72px; height: 72px; border-radius: 14px;
    background:
      radial-gradient(circle at 40% 40%, #F5C67E 0 20px, transparent 21px),
      radial-gradient(circle at 70% 65%, #E07B2C 0 16px, transparent 17px),
      radial-gradient(circle at 25% 70%, #F5923E 0 12px, transparent 13px),
      linear-gradient(135deg, #FAF6EF 0%, #F3ECDC 100%);
    flex-shrink: 0; border: 1px solid var(--line);
  }
  .v-a .prod-img.b5 {
    background:
      radial-gradient(circle at 50% 50%, #F5C67E 0 24px, transparent 25px),
      radial-gradient(circle at 30% 30%, #E07B2C 0 10px, transparent 11px),
      radial-gradient(circle at 75% 70%, #F5923E 0 11px, transparent 12px),
      linear-gradient(135deg, #FFF8EB 0%, #F5ECD5 100%);
  }
  .v-a .prod-meta { flex: 1; min-width: 0; }
  .v-a .prod-title {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .v-a .prod-title strong {
    font-size: calc(17px * var(--fs-scale));
    font-weight: 700; color: var(--ink);
  }
  .v-a .prod-title .chip {
    font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
    color: var(--leaf-deep); background: rgba(107,142,78,.12);
    padding: 3px 8px; border-radius: 6px;
  }
  .v-a .prod-desc {
    font-size: calc(13px * var(--fs-scale));
    color: #6B6355; line-height: 1.55; margin: 0 0 8px;
  }
  .v-a .prod-price {
    font-size: calc(18px * var(--fs-scale));
    font-weight: 800; color: var(--orange-deep);
    letter-spacing: -0.02em;
  }
  .v-a .prod-price .won {
    font-size: 0.75em; font-weight: 600; color: var(--orange-deep);
  }

  /* stepper */
  .stepper {
    display: flex; align-items: center; gap: 10px;
    margin-top: 16px; justify-content: space-between;
    padding-top: 14px; border-top: 1px dashed var(--line);
  }
  .stepper .lbl { font-size: calc(13px * var(--fs-scale)); color: #6B6355; font-weight: 500; }
  .stepper .ctrl { display: flex; align-items: center; gap: 14px; }
  .stepper button {
    width: 40px; height: 40px; border-radius: 12px;
    border: 1.5px solid var(--line); background: white;
    display: grid; place-items: center;
    cursor: pointer; transition: all .15s;
    font-size: 20px; color: var(--ink);
    font-family: inherit; font-weight: 600;
  }
  .stepper button:hover:not(:disabled) { border-color: var(--orange); color: var(--orange-deep); }
  .stepper button:active:not(:disabled) { transform: scale(.94); }
  .stepper button:disabled { color: #D0C8B8; cursor: not-allowed; }
  .stepper .count {
    min-width: 28px; text-align: center;
    font-size: calc(18px * var(--fs-scale));
    font-weight: 700; color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  /* sticky total A */
  .v-a .total-sticky {
    position: sticky; top: 0; z-index: 20;
    margin: 0 -20px;
    padding: 14px 20px;
    background: rgba(250,246,239,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(107,142,78,.15);
  }
  .v-a .total-box {
    background: white; border-radius: 16px; padding: 14px 16px;
    border: 1.5px solid var(--orange);
    box-shadow: 0 4px 12px rgba(245,146,62,.1);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .v-a .total-box.empty {
    border-color: var(--line); box-shadow: none;
  }
  .v-a .total-breakdown {
    font-size: calc(12px * var(--fs-scale));
    color: #6B6355; line-height: 1.5; flex: 1; min-width: 0;
  }
  .v-a .total-breakdown.empty { color: #B8B0A0; font-size: calc(13px * var(--fs-scale)); }
  .v-a .total-breakdown b { color: var(--ink); font-weight: 600; }
  .v-a .total-sum {
    font-size: calc(22px * var(--fs-scale));
    font-weight: 900; color: var(--orange-deep);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .v-a .total-sum .won {
    font-size: .7em; font-weight: 700; margin-left: 1px;
  }

  /* receiver toggle */
  .toggle-row {
    background: white; border-radius: 14px; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; border: 1.5px solid var(--line);
    margin-bottom: 14px;
  }
  .toggle-row .label {
    font-size: calc(15px * var(--fs-scale)); font-weight: 600; color: var(--ink);
  }
  .toggle-row .sub {
    font-size: calc(12px * var(--fs-scale));
    color: #8B8578; margin-top: 2px;
  }
  .switch {
    width: 52px; height: 30px; border-radius: 999px;
    background: #D8D1C2; position: relative; cursor: pointer;
    transition: background .2s;
    flex-shrink: 0;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%;
    background: white;
    box-shadow: 0 2px 6px rgba(0,0,0,.18);
    transition: transform .22s cubic-bezier(.3,1.3,.3,1);
  }
  .switch.on { background: var(--leaf); }
  .switch.on::after { transform: translateX(22px); }

  .row-2 { display: grid; grid-template-columns: 120px 1fr; gap: 10px; }

  .addr-btn {
    height: 48px; padding: 0 14px;
    background: var(--ink); color: white; border: 0; border-radius: 12px;
    font-family: inherit; font-size: calc(14px * var(--fs-scale)); font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }

  /* bank card A */
  .bank-card {
    background: linear-gradient(135deg, #FFFEFB 0%, #FDF7EB 100%);
    border: 1.5px solid var(--orange);
    border-radius: 18px; padding: 18px;
    position: relative; overflow: hidden;
  }
  .bank-card::before {
    content: ''; position: absolute; right: -20px; top: -20px;
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, rgba(245,146,62,.25) 0%, transparent 70%);
  }
  .bank-card .lbl { font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.06em; }
  .bank-card .num {
    font-size: calc(20px * var(--fs-scale));
    font-weight: 800; color: var(--ink); letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
  }
  .bank-card .owner { font-size: calc(13px * var(--fs-scale)); color: #6B6355; }
  .copy-btn {
    position: absolute; top: 16px; right: 16px;
    width: 54px; height: 54px; border-radius: 14px;
    background: var(--orange); color: white;
    border: 0; cursor: pointer; display: grid; place-items: center;
    box-shadow: 0 4px 12px rgba(245,146,62,.35);
    transition: transform .08s;
  }
  .copy-btn:active { transform: scale(.94); }

  /* consent */
  .consent {
    display: flex; align-items: start; gap: 10px;
    padding: 14px 16px; background: white; border: 1.5px solid var(--line);
    border-radius: 14px; cursor: pointer;
    margin-top: 14px;
  }
  .consent .check {
    width: 22px; height: 22px; border-radius: 6px;
    border: 2px solid var(--line); background: white;
    flex-shrink: 0; display: grid; place-items: center;
    margin-top: 1px;
    transition: all .15s;
  }
  .consent.on .check { background: var(--orange); border-color: var(--orange); }
  .consent .txt {
    font-size: calc(13px * var(--fs-scale)); color: #4A453A; line-height: 1.55;
  }
  .consent .txt b { color: var(--ink); font-weight: 600; }

  /* Address modal (shared) */
  .modal-scrim {
    position: absolute; inset: 0; z-index: 120;
    background: rgba(28,26,21,.55);
    display: none;
    align-items: end;
    animation: fadeIn .18s ease;
  }
  .modal-scrim.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-sheet {
    width: 100%; height: 82%;
    background: white; border-radius: 20px 20px 0 0;
    padding: 8px 20px 24px;
    display: flex; flex-direction: column;
    animation: slideUp .28s cubic-bezier(.3,1.2,.3,1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-sheet .handle {
    width: 40px; height: 4px; background: #D8D1C2; border-radius: 2px;
    margin: 8px auto 14px;
  }
  .modal-sheet h3 {
    font-size: 17px; font-weight: 700; margin: 0 0 12px;
  }
  .modal-sheet .search-box {
    display: flex; align-items: center; gap: 8px;
    background: #F5F0E6; border-radius: 12px; padding: 0 14px;
    height: 48px;
  }
  .modal-sheet .search-box input {
    flex: 1; border: 0; background: transparent; outline: none;
    font-family: inherit; font-size: 15px;
  }
  .modal-sheet .results {
    flex: 1; overflow-y: auto; margin: 12px -20px 0; padding: 0 20px;
  }
  .modal-sheet .result-item {
    padding: 14px 0; border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .modal-sheet .result-item:hover { background: #FAF6EF; margin: 0 -20px; padding: 14px 20px; }
  .modal-sheet .zip {
    display: inline-block; padding: 2px 8px; background: var(--leaf);
    color: white; font-size: 11px; font-weight: 700; border-radius: 4px;
    margin-right: 8px;
    font-variant-numeric: tabular-nums;
  }
  .modal-sheet .addr-main { font-size: 14px; font-weight: 500; color: var(--ink); margin-top: 6px; }
  .modal-sheet .addr-old { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .modal-sheet .close-x {
    position: absolute; top: 14px; right: 18px; width: 32px; height: 32px;
    border-radius: 50%; background: #F5F0E6; border: 0;
    display: grid; place-items: center; cursor: pointer; font-size: 18px;
    color: var(--ink);
  }
  .modal-sheet .empty-hint {
    text-align: center; padding: 30px 20px; color: var(--muted); font-size: 13px;
    line-height: 1.6;
  }

  /* Success screen */
  .success-screen {
    position: absolute; inset: 0; z-index: 200;
    background: var(--cream);
    display: none;
    flex-direction: column;
    animation: fadeIn .2s ease;
  }
  .success-screen.show { display: flex; }

function formatPhone(raw) {
  const d = (raw || '').replace(/\D/g, '').slice(0, 11);
  if (d.length < 4) return d;
  if (d.length < 8) return `${d.slice(0,3)}-${d.slice(3)}`;
  return `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`;
}

function formatWon(n) {
  return (n || 0).toLocaleString('ko-KR');
}

function useCountUp(target, duration = 420) {
  const [val, setVal] = useState(target);
  const prev = useRef(target);
  const rafRef = useRef();
  useEffect(() => {
    if (target === prev.current) return;
    cancelAnimationFrame(rafRef.current);
    const from = prev.current;
    const to = target;
    const start = performance.now();
    const step = (t) => {
      const p = Math.min(1, (t - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      const curr = Math.round(from + (to - from) * eased);
      setVal(curr);
      if (p < 1) rafRef.current = requestAnimationFrame(step);
      else prev.current = to;
    };
    rafRef.current = requestAnimationFrame(step);
    return () => cancelAnimationFrame(rafRef.current);
  }, [target, duration]);
  return val;
}

function useOrderState() {
  const [qty, setQty] = useState({ kg10: 0, kg5: 0 });
  const [orderer, setOrderer] = useState({ name: '', phone: '', zip: '', addr: '', detail: '' });
  const [selfReceive, setSelfReceive] = useState(true);
  const [receiver, setReceiver] = useState({ name: '', zip: '', addr: '', detail: '', phone: '' });
  const [depositor, setDepositor] = useState('');
  const [agreed, setAgreed] = useState(false);

  const total = qty.kg10 * PRODUCTS.kg10.price + qty.kg5 * PRODUCTS.kg5.price;
  const totalCount = qty.kg10 + qty.kg5;

  const breakdown = useMemo(() => {
    const parts = [];
    if (qty.kg5 > 0) parts.push(`5kg ${qty.kg5}박스`);
    if (qty.kg10 > 0) parts.push(`10kg ${qty.kg10}박스`);
    return parts.join(' + ');
  }, [qty]);

  const isValid = totalCount > 0
    && orderer.name.trim().length >= 2
    && orderer.phone.replace(/\D/g, '').length >= 10
    && orderer.zip.length > 0
    && orderer.detail.trim().length > 0

      receiver.name.trim().length >= 2 &&
      receiver.zip.length > 0 &&
      receiver.detail.trim().length > 0 &&
      receiver.phone.replace(/\D/g, '').length >= 10
    ))
    && depositor.trim().length >= 2
    && agreed;

  const bump = (id, delta) => setQty(q => ({ ...q, [id]: Math.max(0, Math.min(99, q[id] + delta)) }));

  return {
    qty, setQty, bump, orderer, setOrderer, selfReceive, setSelfReceive,
    receiver, setReceiver, depositor, setDepositor, agreed, setAgreed,
    total, totalCount, breakdown, isValid,
  };
}

              한 상자 한 상자,<br/>
              저희 가족이 직접 수확하고<br/>
              골라 담아 보내드립니다.
            </p>
            <p style={{ color: 'var(--leaf-deep)', fontWeight: 500 }}>
              맛없으면 꼭 말씀해 주세요.<br/>
              다시 보내드리겠습니다.
            </p>
            <span className="sig-c">— 김용호</span>
          </div>
        </section>

        <section className="section-c">
          <h2><span className="num-c">하나.</span><span className="serif">귤 상자 고르기</span></h2>

          <div className={`prod-c ${s.qty.kg5 > 0 ? 'has' : ''}`} onClick={() => s.qty.kg5 === 0 && s.bump('kg5', 1)}>
            <span className="handtag orange">선물용 추천</span>
            <div className="ptop">
              <div className="pimg b5" />
              <div style={{ flex: 1 }}>
                <h3 className="pname">5kg 선물 상자</h3>
                <p className="pdesc">30~35과 · 균일 사이즈<br/>스티로폼 박스에 단단히 담아요</p>
                <div className="pprice">25,000원</div>
              </div>
            </div>
            <Stepper count={s.qty.kg5} onDec={() => s.bump('kg5', -1)} onInc={() => s.bump('kg5', 1)} />
          </div>

          <div className={`prod-c ${s.qty.kg10 > 0 ? 'has' : ''}`} onClick={() => s.qty.kg10 === 0 && s.bump('kg10', 1)}>
            <span className="handtag">우리집 귤</span>
            <div className="ptop">
              <div className="pimg" />
              <div style={{ flex: 1 }}>
                <h3 className="pname">10kg 일반 상자</h3>
                <p className="pdesc">150~190과 · 작지만<br/>단맛이 진해 실속 있어요</p>
                <div className="pprice">33,000원</div>
              </div>
            </div>
            <Stepper count={s.qty.kg10} onDec={() => s.bump('kg10', -1)} onInc={() => s.bump('kg10', 1)} />
          </div>
        </section>

        <div className="section-c" style={{ paddingTop: 10 }}>
          <div className="total-sticky-c">
            <div className={`total-box-c ${s.totalCount === 0 ? 'empty' : ''}`}>
              {s.totalCount === 0 ? (
                <div className="total-break-c empty">어떤 귤이 좋으실까요?</div>
              ) : (
                <div className="total-break-c">
                  <div className="hand" style={{ fontFamily: "'Nanum Pen Script', cursive", color: 'var(--leaf-deep)', fontSize: 15, marginBottom: 2 }}>오늘의 주문</div>
                  <b>{s.breakdown}</b>
                </div>
              )}
              <TotalNumC value={s.total} empty={s.totalCount === 0} />
            </div>
          </div>
        </div>

        <section className="section-c">
          <h2><span className="num-c">둘.</span><span className="serif">주문하시는 분</span></h2>
          <div style={{ marginBottom: 14 }}>
            <label className="field-label">성함</label>
            <input className="input" placeholder="홍길동" value={s.orderer.name}
              onChange={e => s.setOrderer(o => ({ ...o, name: e.target.value }))} />
          </div>
          <div style={{ marginBottom: 14 }}>
            <label className="field-label">연락처</label>
            <input className="input" type="tel" inputMode="numeric" placeholder="010-0000-0000" value={s.orderer.phone}
              onChange={e => s.setOrderer(o => ({ ...o, phone: formatPhone(e.target.value) }))} />
          </div>
          <div style={{ marginBottom: 14 }}>
            <label className="field-label">우편번호</label>
            <div className="row-2">
              <button className="addr-btn" onClick={() => openAddr('orderer')}>
                <IconSearch /> 검색
              </button>
              <input className="input" placeholder="00000" readOnly value={s.orderer.zip} />
            </div>
          </div>
          <div style={{ marginBottom: 14 }}>
            <label className="field-label">기본 주소</label>
            <input className="input" placeholder="검색 후 자동으로 들어와요" readOnly value={s.orderer.addr} />
          </div>
          <div>
            <label className="field-label">상세 주소</label>
            <input className="input" placeholder="동 · 호수 등" value={s.orderer.detail}
              onChange={e => s.setOrderer(o => ({ ...o, detail: e.target.value }))} />
          </div>
        </section>

        <section className="section-c">
          <h2><span className="num-c">셋.</span><span className="serif">귤이 도착할 곳</span></h2>
          <div className="toggle-row">
            <div>
              <div className="label">제가 받을게요</div>
              <div className="sub">위의 주문자 주소로 보내드려요</div>
            </div>
            <div className={`switch ${s.selfReceive ? 'on' : ''}`} onClick={() => s.setSelfReceive(v => !v)} />
          </div>

          {!s.selfReceive && (
            <div style={{ display: 'grid', gap: 14 }}>
              <div>
                <label className="field-label">받으시는 분 성함</label>
                <input className="input" placeholder="김제주" value={s.receiver.name}
                  onChange={e => s.setReceiver(r => ({ ...r, name: e.target.value }))} />
              </div>
              <div>
                <label className="field-label">우편번호</label>
                <div className="row-2">
                  <button className="addr-btn" onClick={() => openAddr('receiver')}>
                    <IconSearch /> 검색
                  </button>
                  <input className="input" placeholder="00000" readOnly value={s.receiver.zip} />
                </div>
              </div>
              <div>
                <label className="field-label">기본 주소</label>
                <input className="input" placeholder="검색 후 자동으로 들어와요" readOnly value={s.receiver.addr} />
              </div>
              <div>
                <label className="field-label">상세 주소</label>
                <input className="input" placeholder="동 · 호수 등" value={s.receiver.detail}
                  onChange={e => s.setReceiver(r => ({ ...r, detail: e.target.value }))} />
              </div>
              <div>
                <label className="field-label">받으시는 분 연락처</label>
                <input className="input" type="tel" inputMode="numeric" placeholder="010-0000-0000" value={s.receiver.phone}
                  onChange={e => s.setReceiver(r => ({ ...r, phone: formatPhone(e.target.value) }))} />
              </div>
            </div>
          )}
        </section>

        <section className="section-c">
          <h2><span className="num-c">넷.</span><span className="serif">입금 계좌</span></h2>
          <div className="bank-card-c">
            <div className="lbl">아래 계좌로 보내주세요</div>
            <div className="num">농협 352-1850-9917-13</div>
            <div className="owner">예금주 김용호 · 제주 성전 농장</div>
            <button className="copy-btn" onClick={onCopyAccount} aria-label="복사">
              <IconCopy />
            </button>
          </div>
          <div style={{ marginTop: 16 }}>
            <label className="field-label">입금자 성함</label>
            <input className="input" placeholder="입금 시 표시될 이름" value={s.depositor}
              onChange={e => s.setDepositor(e.target.value)} />
            <p style={{ fontSize: 12, color: '#6B6355', margin: '10px 0 0', lineHeight: 1.7, fontStyle: 'italic' }}>
              입금 확인되는 대로 이틀 안에 보내드릴게요.<br/>
              혹여 입금자명이 달라지면 미리 알려주세요.
            </p>
          </div>
        </section>

        <section className="section-c" style={{ paddingBottom: 120 }}>
          <div className={`consent ${s.agreed ? 'on' : ''}`} onClick={() => s.setAgreed(v => !v)}>
            <div className="check">
              {s.agreed && <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><path d="M20 6L9 17l-5-5"/></svg>}
            </div>
            <div className="txt">
              <b>개인정보 수집 · 이용에 동의해요</b><br/>
              주문 · 배송 · 환불 목적으로만 쓰이고, 3개월 뒤 파기돼요.
            </div>
          </div>
        </section>
      </div>

      <div className="cta-dock">
        <button className="cta" disabled={!s.isValid} onClick={onSubmit}>
          {s.totalCount === 0 ? '귤을 골라주세요'
            : !s.isValid ? '빠진 칸이 있어요'
            : `${formatWon(s.total)}원 · 주문 보내기`}
        </button>
      </div>

      <window.AddressModal open={addrOpen} onClose={() => setAddrOpen(false)} onPick={onPickAddr} />
      <Toast message={toastMsg} show={toastShow} />

      {success && <SuccessScreenC state={s} onNewOrder={onNewOrder} showToast={showToast} />}
    </div>
  );
}

function SuccessScreenC({ state: s, onNewOrder, showToast }) {
  const onCopy = () => {
    if (navigator.clipboard) navigator.clipboard.writeText('352-1850-9917-13').catch(()=>{});
    showToast('계좌번호를 복사했어요');
  };
  return (
    <div className="success-screen show">
      <window.StatusBar />
      <div className="success-inner">
        <div className="check-circle"><IconCheck /></div>
        <div style={{ fontFamily: "'Nanum Pen Script', cursive", color: 'var(--leaf-deep)', fontSize: 22, textAlign: 'center', marginBottom: 2 }}>고맙습니다,</div>
        <h2 className="serif">주문을 받았어요</h2>
        <p className="sub">입금 확인 후 이틀 안에<br/>정성껏 담아 보내드릴게요</p>

        <div className="summary">
          <h4 className="serif" style={{ color: 'var(--leaf-deep)', fontSize: 14 }}>오늘의 주문</h4>
          {s.qty.kg5 > 0 && <div className="row"><span className="k">5kg 선물 상자</span><span className="v">{s.qty.kg5}박스 · {formatWon(s.qty.kg5*25000)}원</span></div>}
          {s.qty.kg10 > 0 && <div className="row"><span className="k">10kg 일반 상자</span><span className="v">{s.qty.kg10}박스 · {formatWon(s.qty.kg10*33000)}원</span></div>}
          <div className="row total"><span className="k">모두 합해</span><span className="v">{formatWon(s.total)}원</span></div>
        </div>

        <div className="summary">
          <h4 className="serif" style={{ color: 'var(--leaf-deep)', fontSize: 14 }}>귤이 도착할 곳</h4>
          <div className="row"><span className="k">받는 분</span><span className="v">{s.selfReceive ? s.orderer.name : s.receiver.name}</span></div>
          <div className="row"><span className="k">연락처</span><span className="v">{s.selfReceive ? s.orderer.phone : s.receiver.phone}</span></div>
          <div className="row"><span className="k">주소</span><span className="v" style={{ maxWidth: '60%' }}>{s.selfReceive ? `[${s.orderer.zip}] ${s.orderer.addr} ${s.orderer.detail}` : `[${s.receiver.zip}] ${s.receiver.addr} ${s.receiver.detail}`}</span></div>
        </div>

        <div className="summary" style={{ background: '#FFFDF6', borderColor: 'var(--orange)' }}>
          <h4 className="serif" style={{ color: 'var(--orange-deep)', fontSize: 14 }}>입금 부탁드려요</h4>
          <div style={{ fontSize: 16, fontWeight: 700, color: 'var(--ink)', marginBottom: 2 }}>농협 352-1850-9917-13</div>
          <div style={{ fontSize: 13, color: '#5A4E35', marginBottom: 12 }}>김용호 · 입금자명 <b>{s.depositor}</b></div>
          <button className="cta" style={{ height: 52 }} onClick={onCopy}>
            <IconCopy style={{ width: 18, height: 18, stroke: 'white' }} /> 계좌번호 복사하기
          </button>
        </div>

        <div style={{
          background: 'white', border: '1.5px dashed var(--line)', padding: '14px 16px',
          borderRadius: 4, fontFamily: "'Nanum Pen Script', cursive", fontSize: 18,
          color: 'var(--leaf-deep)', textAlign: 'center', lineHeight: 1.6,
          marginBottom: 14, transform: 'rotate(-0.5deg)',
        }}>
          주문해주셔서 정말 고맙습니다.<br/>맛있는 귤로 만나요 🍊
        </div>

        <div className="cta-row">
          <button className="secondary-btn" onClick={onNewOrder}>새 주문</button>
          <button className="cta" onClick={() => showToast('카톡으로 공유했어요')}>카톡 공유</button>
        </div>
      </div>
    </div>
  );
}

function TotalNumC({ value, empty }) {
  const v = window.useCountUp(value);
  if (empty) return <div className="total-sum-c" style={{ color: '#B8B0A0' }}>0원</div>;
  return <div className="total-sum-c">{formatWon(v)}원</div>;
}

window.VariantC = VariantC;
</script>
<script type="text/babel">
/* App wiring */
const { useState: useStateApp, useEffect: useEffectApp } = React;

function App() {
  const [bigFont, setBigFont] = useStateApp(false);

  useEffectApp(() => {
    document.documentElement.style.setProperty('--fs-scale', bigFont ? '1.18' : '1');
    const dot = document.getElementById('tweaksDot');
    if (dot) dot.classList.toggle('on', bigFont);
  }, [bigFont]);

  useEffectApp(() => {
    const btn = document.getElementById('tweaksToggle');
    const onClick = () => setBigFont(v => !v);
    btn && btn.addEventListener('click', onClick);
    return () => btn && btn.removeEventListener('click', onClick);
  }, []);

  return (
    <React.Fragment>
      <div className="variant-col">
        <div className="variant-label">
          <span className="badge">A</span>
          <h2>따뜻한 자연주의</h2>
          <small>· 크림 + 오렌지</small>
        </div>
        <window.PhoneFrame><window.VariantA /></window.PhoneFrame>
      </div>
      <div className="variant-col">
        <div className="variant-label">
          <span className="badge">B</span>
          <h2>미니멀 프리미엄</h2>
          <small>· 블랙/화이트 + 오렌지 포인트</small>
        </div>
        <window.PhoneFrame><window.VariantB /></window.PhoneFrame>
      </div>
      <div className="variant-col">
        <div className="variant-label">
          <span className="badge">C</span>
          <h2>농장 편지</h2>
          <small>· Serif + 손글씨</small>
        </div>
        <window.PhoneFrame><window.VariantC /></window.PhoneFrame>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('gallery')).render(<App />);
</script>

</body>
</html>
